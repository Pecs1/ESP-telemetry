name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  determine-targets:
    name: Determine Build Targets
    runs-on: ubuntu-latest
    outputs:
      targets_json: ${{ steps.set-targets.outputs.targets_json }}
    steps:
      - name: Compute Target Matrix JSON
        id: set-targets
        run: |
          declare -A MCU_MAP=(
            ["gps"]="esp32"
            ["main"]="esp32"
            ["r-lora"]="esp32"
            ["s-lora"]="esp32"
            ["temps"]="esp32"
          )

          ALL_BOARDS=("gps" "main" "r-lora" "s-lora" "temps")
          declare -A SEEN_MCU=()
          JSON_ITEMS=()
          for board in "${ALL_BOARDS[@]}"; do
            mcu="${MCU_MAP[$board]}"
            if [ -z "${SEEN_MCU[$mcu]:-}" ]; then
              SEEN_MCU[$mcu]=1
              boot=true
            else
              boot=false
            fi
            JSON_ITEMS+=("{\"env\":\"$board\",\"mcu\":\"$mcu\",\"boot\":\"$boot\"}")
          done

          MATRIX_JSON="[$(IFS=,; echo "${JSON_ITEMS[*]}")]"
          echo "targets_json=$MATRIX_JSON" >> $GITHUB_OUTPUT

  build:
    needs: determine-targets
    uses: ./.github/workflows/build.yml
    with:
      targets_json: ${{ needs.determine-targets.outputs.targets_json }}
    secrets: inherit

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release_binaries
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd release_binaries
          sha256sum *.bin > sha256sum.txt

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          files: |
            release_binaries/*.bin
            release_binaries/sha256sum.txt
          draft: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
