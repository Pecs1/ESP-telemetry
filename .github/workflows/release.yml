name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Test Tag Name (e.g., v1.0.0-test)'
        required: true
        default: 'v1.0.0-test'
        type: string

permissions:
  contents: read

jobs:
  determine-targets:
    name: Determine Build Targets
    runs-on: ubuntu-latest
    outputs:
      targets_json: ${{ steps.set-targets.outputs.targets_json }}
    steps:
      - name: Compute Target Matrix JSON
        id: set-targets
        run: |
          declare -A MCU_MAP=(
            ["gps"]="esp32"
            ["main"]="esp32"
            ["r-lora"]="esp32"
            ["s-lora"]="esp32"
            ["temps"]="esp32"
          )

          ALL_BOARDS=("gps" "main" "r-lora" "s-lora" "temps")
          declare -A SEEN_MCU=()
          JSON_ITEMS=()
          for board in "${ALL_BOARDS[@]}"; do
            mcu="${MCU_MAP[$board]}"
            if [ -z "${SEEN_MCU[$mcu]:-}" ]; then
              SEEN_MCU[$mcu]=1
              boot=true
            else
              boot=false
            fi
            JSON_ITEMS+=("{\"env\":\"$board\",\"mcu\":\"$mcu\",\"boot\":\"$boot\"}")
          done

          MATRIX_JSON="[$(IFS=,; echo "${JSON_ITEMS[*]}")]"
          echo "targets_json=$MATRIX_JSON" >> $GITHUB_OUTPUT

  build:
    needs: determine-targets
    uses: ./.github/workflows/build.yml
    with:
      targets_json: ${{ needs.determine-targets.outputs.targets_json }}
    secrets: inherit

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release_binaries
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd release_binaries
          sha256sum *.bin > sha256sum.txt
      
      - name: Resolve Release Tag Name
        id: tag-resolver
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.tag-resolver.outputs.name }}
          name: ${{ steps.tag-resolver.outputs.name }}
          files: |
            release_binaries/*.bin
            release_binaries/sha256sum.txt
          draft: true
          body_path: .github/templates/release.md
          generate_release_notes: true
          prerelease: ${{ contains(steps.tag-resolver.outputs.name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
