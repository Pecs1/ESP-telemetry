name: Lint check & Platformio build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  formatting-check:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Run clang-format style check.
      uses: jidicula/clang-format-action@654a770daa28443dd111d133e4083e21c1075674 # v4.18.0
      with:
        clang-format-version: '22'

  build:
    name: Build [env:${{ matrix.env }}]
    runs-on: ubuntu-latest
    needs: formatting-check

    strategy:
      fail-fast: false
      matrix:
        env: [gps, main, r-lora, s-lora, temps]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-${{ matrix.env }}-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.env }}-
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Prepare Secrets & Build Firmware
        env:
          SECRETS_H_BASE64: ${{ secrets.SECRETS_H_BASE64 }}
        run: |
          # setup secrets
          mkdir -p shared/secrets
          echo "$SECRETS_H_BASE64" | base64 -d > shared/secrets/secrets.h

          # build matrix env
          pio run -e ${{ matrix.env }}

      - name: Stage Artifacts
        run: |
          mkdir -p release_artifacts
          cp .pio/build/${{ matrix.env }}/firmware.bin release_artifacts/firmware-${{ matrix.env }}.bin

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-${{ matrix.env }}
          path: release_artifacts/firmware-${{ matrix.env }}.bin

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release_binaries
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd release_binaries
          sha256sum *.bin > sha256sum.txt

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release_binaries/*.bin
            release_binaries/sha256sum.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
