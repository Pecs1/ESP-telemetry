name: Lint check & Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
    tags:
      - "v*"
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'

permissions:
  contents: read

jobs:
  formatting-check:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check for C/C++ file changes
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: changes
      with:
        filters: |
          cpp:
            - '**/*.cpp'
            - '**/*.c'
            - '**/*.h'
            - '**/*.hpp'

    - name: Run clang-format style check
      if: steps.changes.outputs.cpp == 'true'
      uses: jidicula/clang-format-action@654a770daa28443dd111d133e4083e21c1075674 # v4.18.0
      with:
        clang-format-version: '22'

  determine-targets:
    name: Determine Build Targets
    runs-on: ubuntu-latest
    outputs:
      targets_json: ${{ steps.set-targets.outputs.targets_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter Changed Paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shared:
              - 'atria/**'
              - 'system/**'
              - 'platformio.ini'
              - '.github/workflows/**'
            gps:
              - 'boards/gps/**'
            main:
              - 'boards/main/**'
            r-lora:
              - 'boards/R-LoRa/**'
            s-lora:
              - 'boards/S-LoRa/**'
            temps:
              - 'boards/temps/**'

      - name: Compute Target Matrix JSON
        id: set-targets
        run: |
          # Map board environments to their target MCU architecture
          declare -A MCU_MAP=(
            ["gps"]="esp32"
            ["main"]="esp32"
            ["r-lora"]="esp32"
            ["s-lora"]="esp32"
            ["temps"]="esp32"
          )

          ALL_BOARDS=("gps" "main" "r-lora" "s-lora" "temps")
          ACTIVE_BOARDS=()

          # Force full matrix build on release tags or shared code changes
          if [[ "${{ github.ref }}" == refs/tags/* ]] || [ "${{ steps.filter.outputs.shared }}" == "true" ]; then
            ACTIVE_BOARDS=("${ALL_BOARDS[@]}")
          else
            [ "${{ steps.filter.outputs.gps }}" == "true" ] && ACTIVE_BOARDS+=("gps")
            [ "${{ steps.filter.outputs.main }}" == "true" ] && ACTIVE_BOARDS+=("main")
            [ "${{ steps.filter.outputs.r-lora }}" == "true" ] && ACTIVE_BOARDS+=("r-lora")
            [ "${{ steps.filter.outputs.s-lora }}" == "true" ] && ACTIVE_BOARDS+=("s-lora")
            [ "${{ steps.filter.outputs.temps }}" == "true" ] && ACTIVE_BOARDS+=("temps")

            # Fallback to all if no specific board filter triggered
            if [ ${#ACTIVE_BOARDS[@]} -eq 0 ]; then
              ACTIVE_BOARDS=("${ALL_BOARDS[@]}")
            fi
          fi

          # Build JSON array of target objects: [{"env":"gps","mcu":"esp32"}, ...]
          JSON_ITEMS=()
          for board in "${ACTIVE_BOARDS[@]}"; do
            mcu="${MCU_MAP[$board]}"
            JSON_ITEMS+=("{\"env\":\"$board\",\"mcu\":\"$mcu\"}")
          done

          MATRIX_JSON="[$(IFS=,; echo "${JSON_ITEMS[*]}")]"
          echo "targets_json=$MATRIX_JSON" >> $GITHUB_OUTPUT

  build:
    name: Build Firmware Target (${{ matrix.env }})
    runs-on: ubuntu-latest
    needs: [formatting-check, determine-targets]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.determine-targets.outputs.targets_json) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ccache
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ccache

      - name: Cache PlatformIO Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-pkgs-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            pio-pkgs-

      - name: Cache ccache Object Files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/ccache
          key: ccache-${{ matrix.env }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.env }}-
            ccache-

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Prepare Secrets & Signing Key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SECRETS_H_BASE64: ${{ secrets.SECRETS_H_BASE64 }}
        run: |
          mkdir -p atria/secrets
          echo "$SECRETS_H_BASE64" | base64 -d > atria/secrets/secrets.h

          # Place signing key where sdkconfig expects it
          echo "$SIGNING_KEY_BASE64" | base64 -d > system/signature-key.pem

      - name: Build Target Environments
        env:
          CCACHE_DIR: /home/runner/.cache/ccache
          CCACHE_MAXSIZE: 500M
        run: |
          set -o pipefail

          export PATH="/usr/lib/ccache:$PATH"

          echo "--- reset stats for ccache ---"
          ccache --zero-stats

          pio run -e "${{ matrix.env }}" 2>&1 | { grep -Ev "Compiling|Archiving" || true; }

          echo "--- ccache stats ---"
          ccache --show-stats

      - name: Secure Cleanup of Secrets
        if: always()
        run: |
          shred -u system/signature-key.pem 2>/dev/null || rm -f system/signature-key.pem
          shred -u atria/secrets/secrets.h 2>/dev/null || rm -f atria/secrets/secrets.h

      - name: Stage Artifacts
        run: |
          mkdir -p release_artifacts

          # Board Firmware
          if [ -f ".pio/build/${{ matrix.env }}/firmware.bin" ]; then
            cp ".pio/build/${{ matrix.env }}/firmware.bin" "release_artifacts/firmware-${{ matrix.env }}.bin"
          else
            echo "::error::No firmware.bin found for ${{ matrix.env }}"
            exit 1
          fi

          # MCU Bootloader from .pio build directory
          if [ -f ".pio/build/${{ matrix.env }}/bootloader.bin" ]; then
            cp ".pio/build/${{ matrix.env }}/bootloader.bin" "release_artifacts/bootloader-${{ matrix.mcu }}.bin"
          else
            echo "::warning::No bootloader.bin found for ${{ matrix.env }}"
          fi

      - name: Upload Board Firmware Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.env }}
          path: release_artifacts/firmware-${{ matrix.env }}.bin

      - name: Upload Shared MCU Bootloader Artifact
        if: hashFiles(format('release_artifacts/bootloader-{0}.bin', matrix.mcu)) != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootloader-${{ matrix.mcu }}
          path: release_artifacts/bootloader-${{ matrix.mcu }}.bin
          overwrite: true

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release_binaries
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd release_binaries
          sha256sum *.bin > sha256sum.txt

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release_binaries/*.bin
            release_binaries/sha256sum.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
