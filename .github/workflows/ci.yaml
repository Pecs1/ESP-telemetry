name: Lint & Platformio Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  formatting-check:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    
    - name: Run clang-format style check.
      uses: jidicula/clang-format-action@654a770daa28443dd111d133e4083e21c1075674 # v 4.18.0
      with:
        clang-format-version: '22'

  build:
    name: Build [env:${{ matrix.env }}]
    runs-on: ubuntu-latest
    needs: formatting-check

    strategy:
      fail-fast: false
      matrix:
        env: [gps, main, r-lora, s-lora, temps]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            .pio
          key: ${{ runner.os }}-pio-${{ matrix.env }}-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.env }}-
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #7.0.0
        with:
          python-version: '3.12'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Prepare Secrets
        run: cp shared/secrets/secrets.example.h shared/secrets/secrets.h

      - name: Build PlatformIO Project
        run: pio run -e ${{ matrix.env }}
