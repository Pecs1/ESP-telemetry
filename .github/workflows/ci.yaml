name: Lint check & Platformio build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  formatting-check:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Run clang-format style check.
      uses: jidicula/clang-format-action@654a770daa28443dd111d133e4083e21c1075674 # v4.18.0
      with:
        clang-format-version: '22'

  build-bootloaders:
    name: Build Bootloader [target:${{ matrix.target }}]
    runs-on: ubuntu-latest
    needs: formatting-check
    strategy:
      fail-fast: false
      matrix:
        target: [esp32] # currently only have esp32... buut will have diff board soon

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Bootloader Binary
        id: cache-bootloader
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bootloader_out/
          key: bootloader-${{ matrix.target }}-${{ hashFiles('bootloader_src/**') }}

      - name: Setup ESP-IDF
        if: steps.cache-bootloader.outputs.cache-hit != 'true'
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v5.5.5
          target: ${{ matrix.target }}

      - name: Build Target Bootloader
        if: steps.cache-bootloader.outputs.cache-hit != 'true'
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          KEY_PATH=$(mktemp /tmp/key.XXXXXX.pem)
          trap 'shred -u "$KEY_PATH" 2>/dev/null || rm -f "$KEY_PATH"' EXIT
          echo "$SIGNING_KEY_BASE64" | base64 -d > "$KEY_PATH"

          # set SoC target and build bootloader
          idf.py -C system/bootloader set-target ${{ matrix.target }}
          idf.py -C system/bootloader -DCONFIG_SECURE_BOOT_SIGNING_KEY="$KEY_PATH" bootloader

          # stage output for caching and upload
          mkdir -p bootloader_out
          cp system/bootloader/build/bootloader/bootloader.bin "bootloader_out/${{ matrix.target }}-bootloader.bin"

      - name: Upload Bootloader Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootloader-${{ matrix.target }}
          path: bootloader_out/*

  build:
    name: Build [env:${{ matrix.env }}]
    runs-on: ubuntu-latest
    needs: [formatting-check, build-bootloaders]

    strategy:
      fail-fast: false
      matrix:
        env: [gps, main, r-lora, s-lora, temps]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-${{ matrix.env }}-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.env }}-
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Download Bootloader Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bootloader-*
          path: system/bootloaders
          merge-multiple: true

      - name: Prepare Secrets & Build Firmware
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SECRETS_H_BASE64: ${{ secrets.SECRETS_H_BASE64 }}
        run: |
          # setup secrets
          mkdir -p shared/secrets
          echo "$SECRETS_H_BASE64" | base64 -d > shared/secrets/secrets.h

          export SIGNING_KEY_PATH=$(mktemp /tmp/key.XXXXXX.pem)
          trap 'shred -u "$SIGNING_KEY_PATH" 2>/dev/null || rm -f "$SIGNING_KEY_PATH"' EXIT
          echo "$SIGNING_KEY_BASE64" | base64 -d > "$SIGNING_KEY_PATH"

          # build matrix env
          pio run -e ${{ matrix.env }}

      - name: Stage Artifacts
        run: |
          mkdir -p release_artifacts
          cp .pio/build/${{ matrix.env }}/firmware.bin release_artifacts/firmware-${{ matrix.env }}.bin

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-${{ matrix.env }}
          path: release_artifacts/firmware-${{ matrix.env }}.bin

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release_binaries
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd release_binaries
          sha256sum *.bin > sha256sum.txt

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release_binaries/*.bin
            release_binaries/sha256sum.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
