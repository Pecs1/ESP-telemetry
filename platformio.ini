[platformio]
src_dir = .hide

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino, espidf

monitor_speed = 115200
monitor_filters = direct

lib_ldf_mode = chain

build_unflags = 
    -std=gnu++11
    -std=gnu++14
build_flags = 
    -fno-exceptions
    -Wformat=2
    -Werror=format
    -I shared
    -D SERIAL_BAUD=${this.monitor_speed}
    -std=gnu++17

check_tool = clangtidy
check_flags = 
    clangtidy: --config-file=.clang-tidy
check_src_filters =
    +<boards/>
    +<atria/>

[esp32_base]
board = esp32dev
board_build.partitions = system/partitions/${this.board}.csv
extra_scripts = 
    pre:system/handle-sdkconfigs.py
    system/sign-bins.py
board_build.signing_key = system/signature-key.pem

[env:gps]
extends = esp32_base
board_build.cmake_extra_args = -DBOARD_ENV_PATH=gps

[env:main]
extends = esp32_base
board_build.cmake_extra_args = -DBOARD_ENV_PATH=main

[env:r-lora]
extends = esp32_base
board_build.cmake_extra_args = -DBOARD_ENV_PATH=R-LoRa

[env:s-lora]
extends = esp32_base
board_build.cmake_extra_args = -DBOARD_ENV_PATH=S-LoRa


[env:temps]
extends = esp32_base
board_build.cmake_extra_args = -DBOARD_ENV_PATH=temps
lib_deps = 
    milesburton/DallasTemperature@^4.0.6
    paulstoffregen/OneWire@^2.3.8



; not used in production
; just an example for you to see what each thing does
[env:example]
extends = esp32_base
board_build.cmake_extra_args = -DBOARD_ENV_PATH=example

; note that this is just my testing ground,
; you do NOT need this
[env:testing-ground]
extends = esp32_base
board_build.cmake_extra_args = -DBOARD_ENV_PATH=.test
