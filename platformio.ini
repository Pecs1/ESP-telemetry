[platformio]
src_dir = .

[env]
monitor_speed = 115200
monitor_filters = direct
lib_ldf_mode = deep+

build_src_filter = -<*> +<shared/**>

framework = arduino
build_unflags = 
    -std=gnu++11
    -std=gnu++14
build_flags = 
    -I shared
    -D SERIAL_BAUD=${this.monitor_speed}
    -std=gnu++17

check_tool = clangtidy
check_flags = 
    clangtidy: --config-file=.clang-tidy
check_src_filters =
    +<boards/>
    +<shared/>

[esp32_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev

[env:gps]
extends = esp32_base
build_src_filter = ${env.build_src_filter} +<boards/gps/*>

[env:main]
extends = esp32_base
build_src_filter = ${env.build_src_filter} +<boards/main/*>

[env:r-lora]
extends = esp32_base
build_src_filter = ${env.build_src_filter} +<boards/R-LoRa/*>

[env:s-lora]
extends = esp32_base
build_src_filter = ${env.build_src_filter} +<boards/S-LoRa/*>

[env:temps]
extends = esp32_base
build_src_filter = ${env.build_src_filter} +<boards/temps/*>
lib_deps = 
    milesburton/DallasTemperature@^4.0.6
    paulstoffregen/OneWire@^2.3.8



; not used in production
; just an example for you to see what each thing does
[env:example]
extends = esp32_base
build_src_filter = ${env.build_src_filter} +<boards/example/*>


; note that this is just my testing ground,
; you do NOT need this
[env:testing-ground]
extends = esp32_base
build_src_filter = ${env.build_src_filter} +<boards/.test/*>
