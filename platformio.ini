[platformio]
src_dir = .hide

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino, espidf

monitor_speed = 115200
monitor_filters = direct

lib_ldf_mode = chain

build_unflags = 
    -std=gnu++11
    -std=gnu++14
build_flags = 
    -fno-exceptions
    -Wformat=2
    -Werror=format
    -D SERIAL_BAUD=${this.monitor_speed}
    -std=gnu++17

custom_component_remove =
    espressif/esp-dsp
    espressif/libsodium
    espressif/esp-modbus
    espressif/esp_rainmaker
    espressif/rmaker_common
    espressif/esp_insights
    espressif/esp_diagnostics
    espressif/esp_diag_data_store
    espressif/esp_modem
    espressif/qrcode
    espressif/cbor
    chmorgan/esp-libhelix-mp3
    espressif/network_provisioning
    joltwallet/littlefs
    espressif/lan867x
    espressif/esp-zboss-lib
    espressif/esp-zigbee-lib

check_tool = clangtidy
check_flags = 
    clangtidy: --config-file=.clang-tidy
check_src_filters =
    +<boards/>
    +<atria/>

[esp32_base]
board = esp32dev
board_build.partitions = system/partitions/${this.board}.csv
extra_scripts = 
    pre:system/handle-sdkconfigs.py
    system/sign-bins.py
board_build.signing_key = system/signature-key.pem

[env:gps]
extends = esp32_base
build_flags = ${env.build_flags} -DBOARD_NAME=\"GPS\"
board_build.cmake_extra_args =
    -DBOARD_ENV_PATH=gps
    -DPROJECT_VER=0.3.0

[env:main]
extends = esp32_base
build_flags = ${env.build_flags} -DBOARD_NAME=\"MCU\"
board_build.cmake_extra_args =
    -DBOARD_ENV_PATH=main
    -DPROJECT_VER=0.0.1

[env:r-lora]
extends = esp32_base
build_flags = ${env.build_flags} -DBOARD_NAME=\"R-LoRa\"
board_build.cmake_extra_args =
    -DBOARD_ENV_PATH=r-lora
    -DPROJECT_VER=0.0.1

[env:s-lora]
extends = esp32_base
build_flags = ${env.build_flags} -DBOARD_NAME=\"S-LoRa\"
board_build.cmake_extra_args =
    -DBOARD_ENV_PATH=s-lora
    -DPROJECT_VER=0.0.1

[env:temps]
extends = esp32_base
build_flags = ${env.build_flags} -DBOARD_NAME=\"Temps\"
board_build.cmake_extra_args =
    -DBOARD_ENV_PATH=temps
    -DPROJECT_VER=0.1.0

lib_deps = 
    milesburton/DallasTemperature@^4.0.6
    paulstoffregen/OneWire@^2.3.8



; not used in production
; just an example for you to see what each thing does
[env:example]
extends = esp32_base
build_flags = ${env.build_flags} -DBOARD_NAME=\"YourBoard\"
board_build.cmake_extra_args =
    -DBOARD_ENV_PATH=example
    -DPROJECT_VER=0.1.0

; note that this is just my testing ground,
; you do NOT need this
[env:testing-ground]
extends = esp32_base
build_flags = ${env.build_flags} -DBOARD_NAME=\"Test\"
board_build.cmake_extra_args =
    -DBOARD_ENV_PATH=.test
    -DPROJECT_VER=9.9.0
